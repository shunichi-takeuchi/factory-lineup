<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ラインアップ管理</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', 'Noto Sans JP', sans-serif; background: #0f1117; color: #e2e8f0; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #1a1d27; } ::-webkit-scrollbar-thumb { background: #3a3f55; border-radius: 3px; }
  .btn { padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.15s; }
  .btn-primary { background: #3b82f6; color: #fff; } .btn-primary:hover { background: #2563eb; }
  .btn-success { background: #10b981; color: #fff; } .btn-success:hover { background: #059669; }
  .btn-danger { background: #ef4444; color: #fff; } .btn-danger:hover { background: #dc2626; }
  .btn-ghost { background: #1e2235; color: #94a3b8; border: 1px solid #2d3348; } .btn-ghost:hover { background: #2d3348; color: #e2e8f0; }
  input, select { background: #1e2235; border: 1px solid #2d3348; color: #e2e8f0; border-radius: 6px; padding: 7px 10px; font-size: 12px; }
  input:focus, select:focus { outline: none; border-color: #3b82f6; }
  .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .tag-regular { background: #1d4ed822; color: #60a5fa; border: 1px solid #1d4ed855; }
  .tag-support { background: #d9770622; color: #fb923c; border: 1px solid #d9770655; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef, useCallback } = React;
const { createClient } = supabase;

const SUPABASE_URL = "https://hjtmqswxzilwktdfbons.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqdG1xc3d4emlsd2t0ZGZib25zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg2MDAsImV4cCI6MjA4ODc3NDYwMH0._gbFKbjoB3UtH94MTZWDczhVbgMzi8LPTSCFiuMuUoY";
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f43f5e','#a855f7','#14b8a6'];

function getAvatar(name) { return name ? name.charAt(0) : '?'; }
function getColor(idx) { return COLORS[idx % COLORS.length]; }
function today() { return new Date().toISOString().split('T')[0]; }

// ========== TABS ==========
const TABS = ['📋 作業員管理', '⚙️ 工程管理', '📅 日次配置'];

function App() {
  const [tab, setTab] = useState(0);
  const [workers, setWorkers] = useState([]);
  const [processes, setProcesses] = useState([]);
  const [assignments, setAssignments] = useState([]);
  const [date, setDate] = useState(today());
  const [line, setLine] = useState('A');
  const [status, setStatus] = useState('');
  const [loading, setLoading] = useState(true);

  const showStatus = (msg, type='ok') => { setStatus({msg, type}); setTimeout(()=>setStatus(''), 3000); };

  useEffect(() => { loadAll(); }, []);
  useEffect(() => { loadAssignments(); }, [date, line]);

  const loadAll = async () => {
    setLoading(true);
    const [{ data: w }, { data: p }] = await Promise.all([
      db.from('workers').select('*').order('worker_type').order('name'),
      db.from('processes').select('*').order('line').order('process_no'),
    ]);
    setWorkers((w||[]).map((wk,i) => ({ ...wk, color: wk.color || getColor(i), avatar: wk.avatar || getAvatar(wk.name) })));
    setProcesses(p||[]);
    setLoading(false);
  };

  const loadAssignments = async () => {
    const { data } = await db.from('daily_assignments').select('*').eq('date', date).eq('line', line);
    setAssignments(data||[]);
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh', overflow:'hidden' }}>
      {/* ヘッダー */}
      <div style={{ background:'#151823', borderBottom:'1px solid #1e2235', padding:'0 20px', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <div style={{ fontSize:18, fontWeight:800, color:'#3b82f6', padding:'14px 0' }}>🏭 ラインアップ管理</div>
          <div style={{ display:'flex', gap:2 }}>
            {TABS.map((t,i) => (
              <button key={i} onClick={() => setTab(i)} style={{
                padding:'14px 16px', background:'none', border:'none', borderBottom: tab===i ? '2px solid #3b82f6' : '2px solid transparent',
                color: tab===i ? '#3b82f6' : '#64748b', cursor:'pointer', fontSize:12, fontWeight:600, transition:'all 0.15s'
              }}>{t}</button>
            ))}
          </div>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
          {status && <span style={{ fontSize:12, color: status.type==='err' ? '#f87171' : '#4ade80' }}>{status.msg}</span>}
          <span style={{ fontSize:11, color:'#475569' }}>作業員 {workers.length}名 / 工程 {processes.length}件</span>
        </div>
      </div>

      {/* コンテンツ */}
      <div style={{ flex:1, overflow:'hidden' }}>
        {loading ? (
          <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100%', color:'#475569' }}>読み込み中...</div>
        ) : tab===0 ? (
          <WorkerTab workers={workers} setWorkers={setWorkers} showStatus={showStatus} />
        ) : tab===1 ? (
          <ProcessTab processes={processes} setProcesses={setProcesses} showStatus={showStatus} />
        ) : (
          <AssignTab workers={workers} processes={processes} assignments={assignments} setAssignments={setAssignments}
            date={date} setDate={setDate} line={line} setLine={setLine} showStatus={showStatus} loadAssignments={loadAssignments} />
        )}
      </div>
    </div>
  );
}

// ========== 作業員管理タブ ==========
function WorkerTab({ workers, setWorkers, showStatus }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ employee_no:'', name:'', worker_type:'正規', department:'', skill:'' });
  const [csvText, setCsvText] = useState('');
  const [showCsv, setShowCsv] = useState(false);
  const fileRef = useRef();

  const addWorker = async () => {
    if (!form.name.trim()) return;
    const idx = workers.length;
    const { data } = await db.from('workers').insert({
      ...form, avatar: getAvatar(form.name), color: getColor(idx)
    }).select().single();
    if (data) {
      setWorkers(prev => [...prev, data]);
      setForm({ employee_no:'', name:'', worker_type:'正規', department:'', skill:'' });
      setShowForm(false);
      showStatus('✅ 追加しました');
    }
  };

  const deleteWorker = async (id) => {
    await db.from('workers').delete().eq('id', id);
    setWorkers(prev => prev.filter(w => w.id !== id));
    showStatus('🗑️ 削除しました');
  };

  const handleCsvFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => setCsvText(ev.target.result);
    reader.readAsText(file, 'UTF-8');
    setShowCsv(true);
  };

  const importCsv = async () => {
    const lines = csvText.trim().split('\n');
    const header = lines[0].split(',').map(h => h.trim().replace(/"/g,''));
    const rows = lines.slice(1).map(line => {
      const vals = line.split(',').map(v => v.trim().replace(/"/g,''));
      const obj = {};
      header.forEach((h,i) => obj[h] = vals[i]||'');
      return obj;
    }).filter(r => r.name || r['氏名'] || r['名前']);

    const toInsert = rows.map((r, i) => ({
      employee_no: r.employee_no || r['社員番号'] || r['No'] || '',
      name: r.name || r['氏名'] || r['名前'] || '',
      worker_type: r.worker_type || r['区分'] || r['種別'] || '正規',
      department: r.department || r['部署'] || r['所属'] || '',
      skill: r.skill || r['スキル'] || r['工程'] || '',
      avatar: getAvatar(r.name || r['氏名'] || r['名前'] || '?'),
      color: getColor(workers.length + i),
    }));

    const { data } = await db.from('workers').insert(toInsert).select();
    if (data) {
      setWorkers(prev => [...prev, ...data]);
      setShowCsv(false);
      setCsvText('');
      showStatus(`✅ ${data.length}名インポートしました`);
    }
  };

  const regular = workers.filter(w => w.worker_type === '正規');
  const support = workers.filter(w => w.worker_type !== '正規');

  return (
    <div style={{ display:'flex', height:'100%', overflow:'hidden' }}>
      <div style={{ flex:1, overflowY:'auto', padding:20 }}>
        {/* ツールバー */}
        <div style={{ display:'flex', gap:8, marginBottom:16, flexWrap:'wrap' }}>
          <button className="btn btn-primary" onClick={() => setShowForm(!showForm)}>＋ 手動追加</button>
          <button className="btn btn-ghost" onClick={() => fileRef.current.click()}>📂 CSVインポート</button>
          <input ref={fileRef} type="file" accept=".csv" style={{ display:'none' }} onChange={handleCsvFile} />
          <span style={{ fontSize:11, color:'#475569', alignSelf:'center', marginLeft:'auto' }}>
            CSV列名：employee_no, name, worker_type（正規/応援）, department, skill
          </span>
        </div>

        {/* CSV取り込みプレビュー */}
        {showCsv && (
          <div style={{ background:'#151823', border:'1px solid #2d3348', borderRadius:8, padding:16, marginBottom:16 }}>
            <div style={{ fontSize:12, color:'#94a3b8', marginBottom:8 }}>CSVプレビュー（先頭3行）：</div>
            <pre style={{ fontSize:11, color:'#64748b', marginBottom:12, maxHeight:80, overflow:'auto' }}>
              {csvText.split('\n').slice(0,4).join('\n')}
            </pre>
            <div style={{ display:'flex', gap:8 }}>
              <button className="btn btn-success" onClick={importCsv}>インポート実行</button>
              <button className="btn btn-ghost" onClick={() => setShowCsv(false)}>キャンセル</button>
            </div>
          </div>
        )}

        {/* 手動追加フォーム */}
        {showForm && (
          <div style={{ background:'#151823', border:'1px solid #2d3348', borderRadius:8, padding:16, marginBottom:16, display:'flex', gap:8, flexWrap:'wrap', alignItems:'flex-end' }}>
            <div><div style={{ fontSize:11, color:'#64748b', marginBottom:4 }}>社員No</div><input value={form.employee_no} onChange={e=>setForm({...form,employee_no:e.target.value})} style={{ width:80 }} /></div>
            <div><div style={{ fontSize:11, color:'#64748b', marginBottom:4 }}>氏名 *</div><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} style={{ width:120 }} /></div>
            <div><div style={{ fontSize:11, color:'#64748b', marginBottom:4 }}>区分</div>
              <select value={form.worker_type} onChange={e=>setForm({...form,worker_type:e.target.value})} style={{ width:80 }}>
                <option>正規</option><option>応援</option>
              </select>
            </div>
            <div><div style={{ fontSize:11, color:'#64748b', marginBottom:4 }}>部署</div><input value={form.department} onChange={e=>setForm({...form,department:e.target.value})} style={{ width:100 }} /></div>
            <div><div style={{ fontSize:11, color:'#64748b', marginBottom:4 }}>スキル</div><input value={form.skill} onChange={e=>setForm({...form,skill:e.target.value})} style={{ width:120 }} /></div>
            <button className="btn btn-success" onClick={addWorker}>追加</button>
            <button className="btn btn-ghost" onClick={()=>setShowForm(false)}>閉じる</button>
          </div>
        )}

        {/* 正規要員 */}
        <WorkerSection title="正規要員" workers={regular} onDelete={deleteWorker} color="#3b82f6" />
        <div style={{ marginTop:16 }}>
          <WorkerSection title="応援要員" workers={support} onDelete={deleteWorker} color="#f97316" />
        </div>
      </div>
    </div>
  );
}

function WorkerSection({ title, workers, onDelete, color }) {
  return (
    <div>
      <div style={{ fontSize:13, fontWeight:700, color, marginBottom:8, display:'flex', alignItems:'center', gap:8 }}>
        {title} <span style={{ fontSize:11, fontWeight:400, color:'#475569' }}>{workers.length}名</span>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(220px,1fr))', gap:8 }}>
        {workers.map(w => (
          <div key={w.id} style={{ background:'#151823', border:'1px solid #1e2235', borderRadius:8, padding:'10px 12px', display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:34, height:34, borderRadius:'50%', background:w.color, display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:700, color:'#fff', flexShrink:0 }}>{w.avatar}</div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:12, fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{w.employee_no ? `[${w.employee_no}] ` : ''}{w.name}</div>
              <div style={{ fontSize:10, color:'#475569' }}>{w.department}{w.department && w.skill ? ' / ' : ''}{w.skill}</div>
            </div>
            <button onClick={() => onDelete(w.id)} style={{ background:'none', border:'none', color:'#475569', cursor:'pointer', fontSize:13, flexShrink:0 }}>✕</button>
          </div>
        ))}
        {workers.length === 0 && <div style={{ fontSize:12, color:'#334155', padding:'10px 0' }}>登録なし</div>}
      </div>
    </div>
  );
}

// ========== 工程管理タブ ==========
function ProcessTab({ processes, setProcesses, showStatus }) {
  const [form, setForm] = useState({ process_no:'', process_name:'', line:'A', required_count:1 });
  const [showForm, setShowForm] = useState(false);
  const [copyFrom, setCopyFrom] = useState('A');
  const [csvText, setCsvText] = useState('');
  const [showCsv, setShowCsv] = useState(false);
  const fileRef = useRef();

  const handleCsvFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => setCsvText(ev.target.result);
    reader.readAsText(file, 'UTF-8');
    setShowCsv(true);
    e.target.value = '';
  };

  const importCsv = async () => {
    const lines = csvText.trim().split('\n');
    const header = lines[0].split(',').map(h => h.trim().replace(/"/g,''));
    const rows = lines.slice(1).map(line => {
      const vals = line.split(',').map(v => v.trim().replace(/"/g,''));
      const obj = {};
      header.forEach((h,i) => obj[h] = vals[i]||'');
      return obj;
    }).filter(r => r.process_no || r['工程No'] || r['工程NO']);

    const toInsert = rows.map(r => ({
      line: r.line || r['ライン'] || 'A',
      process_no: r.process_no || r['工程No'] || r['工程NO'] || '',
      process_name: r.process_name || r['工程名'] || '',
      required_count: parseInt(r.required_count || r['必要人数'] || r['人数'] || '1') || 1,
    }));

    const { data } = await db.from('processes').insert(toInsert).select();
    if (data) {
      setProcesses(prev => [...prev, ...data].sort((a,b) => a.line.localeCompare(b.line) || a.process_no.localeCompare(b.process_no)));
      setShowCsv(false);
      setCsvText('');
      showStatus(`✅ ${data.length}工程インポートしました`);
    }
  };

  const addProcess = async () => {
    if (!form.process_no || !form.process_name) return;
    const { data } = await db.from('processes').insert(form).select().single();
    if (data) {
      setProcesses(prev => [...prev, data].sort((a,b) => a.line.localeCompare(b.line) || a.process_no.localeCompare(b.process_no)));
      setForm({ process_no:'', process_name:'', line:'A', required_count:1 });
      showStatus('✅ 追加しました');
    }
  };

  const deleteProcess = async (id) => {
    await db.from('processes').delete().eq('id', id);
    setProcesses(prev => prev.filter(p => p.id !== id));
    showStatus('🗑️ 削除しました');
  };

  const copyLineProcesses = async () => {
    const toLine = copyFrom === 'A' ? 'B' : 'A';
    const src = processes.filter(p => p.line === copyFrom);
    if (src.length === 0) { showStatus('コピー元に工程がありません', 'err'); return; }
    const toInsert = src.map(p => ({ process_no: p.process_no, process_name: p.process_name, line: toLine, required_count: p.required_count }));
    const { data } = await db.from('processes').insert(toInsert).select();
    if (data) {
      setProcesses(prev => [...prev, ...data].sort((a,b) => a.line.localeCompare(b.line) || a.process_no.localeCompare(b.process_no)));
      showStatus(`✅ ${copyFrom}ライン→${toLine}ラインにコピーしました`);
    }
  };

  const lineA = processes.filter(p => p.line === 'A');
  const lineB = processes.filter(p => p.line === 'B');

  return (
    <div style={{ overflowY:'auto', height:'100%', padding:20 }}>
      <div style={{ display:'flex', gap:8, marginBottom:16, flexWrap:'wrap', alignItems:'center' }}>
        <button className="btn btn-primary" onClick={() => setShowForm(!showForm)}>＋ 工程追加</button>
        <button className="btn btn-ghost" onClick={() => fileRef.current.click()}>📂 CSVインポート</button>
        <input ref={fileRef} type="file" accept=".csv" style={{ display:'none' }} onChange={handleCsvFile} />
        <span style={{ fontSize:11, color:'#475569' }}>列名: line, process_no, process_name, required_count</span>
        <div style={{ display:'flex', gap:6, alignItems:'center', marginLeft:'auto' }}>
          <span style={{ fontSize:12, color:'#64748b' }}>ラインコピー：</span>
          <select value={copyFrom} onChange={e=>setCopyFrom(e.target.value)} style={{ width:80 }}>
            <option value="A">Aライン</option><option value="B">Bライン</option>
          </select>
          <button className="btn btn-ghost" onClick={copyLineProcesses}>コピー実行</button>
        </div>
      </div>

      {showCsv && (
        <div style={{ background:'#151823', border:'1px solid #2d3348', borderRadius:8, padding:16, marginBottom:16 }}>
          <div style={{ fontSize:12, color:'#94a3b8', marginBottom:8 }}>CSVプレビュー（先頭3行）：</div>
          <pre style={{ fontSize:11, color:'#64748b', marginBottom:12, maxHeight:80, overflow:'auto' }}>
            {csvText.split('\n').slice(0,4).join('\n')}
          </pre>
          <div style={{ display:'flex', gap:8 }}>
            <button className="btn btn-success" onClick={importCsv}>インポート実行</button>
            <button className="btn btn-ghost" onClick={() => setShowCsv(false)}>キャンセル</button>
          </div>
        </div>
      )}

      {showForm && (
        <div style={{ background:'#151823', border:'1px solid #2d3348', borderRadius:8, padding:16, marginBottom:16, display:'flex', gap:8, flexWrap:'wrap', alignItems:'flex-end' }}>
          <div><div style={{ fontSize:11, color:'#64748b', marginBottom:4 }}>ライン</div>
            <select value={form.line} onChange={e=>setForm({...form,line:e.target.value})} style={{ width:70 }}>
              <option>A</option><option>B</option>
            </select>
          </div>
          <div><div style={{ fontSize:11, color:'#64748b', marginBottom:4 }}>工程No *</div><input value={form.process_no} onChange={e=>setForm({...form,process_no:e.target.value})} style={{ width:80 }} placeholder="例: 01" /></div>
          <div><div style={{ fontSize:11, color:'#64748b', marginBottom:4 }}>工程名 *</div><input value={form.process_name} onChange={e=>setForm({...form,process_name:e.target.value})} style={{ width:160 }} placeholder="例: 組立" /></div>
          <div><div style={{ fontSize:11, color:'#64748b', marginBottom:4 }}>必要人数</div><input type="number" min="1" value={form.required_count} onChange={e=>setForm({...form,required_count:parseInt(e.target.value)||1})} style={{ width:60 }} /></div>
          <button className="btn btn-success" onClick={addProcess}>追加</button>
          <button className="btn btn-ghost" onClick={()=>setShowForm(false)}>閉じる</button>
        </div>
      )}

      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
        {[['A', lineA, '#3b82f6'], ['B', lineB, '#a855f7']].map(([ln, procs, col]) => (
          <div key={ln}>
            <div style={{ fontSize:14, fontWeight:700, color:col, marginBottom:10 }}>{ln}ライン <span style={{ fontSize:11, fontWeight:400, color:'#475569' }}>{procs.length}工程</span></div>
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              {procs.map(p => (
                <div key={p.id} style={{ background:'#151823', border:'1px solid #1e2235', borderRadius:8, padding:'10px 14px', display:'flex', alignItems:'center', gap:10 }}>
                  <div style={{ width:32, height:32, borderRadius:6, background:`${col}22`, border:`1px solid ${col}55`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, color:col, flexShrink:0 }}>{p.process_no}</div>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:12, fontWeight:600 }}>{p.process_name}</div>
                    <div style={{ fontSize:10, color:'#475569' }}>必要: {p.required_count}名</div>
                  </div>
                  <button onClick={() => deleteProcess(p.id)} style={{ background:'none', border:'none', color:'#475569', cursor:'pointer', fontSize:13 }}>✕</button>
                </div>
              ))}
              {procs.length === 0 && <div style={{ fontSize:12, color:'#334155' }}>工程なし</div>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ========== 日次配置タブ ==========
function AssignTab({ workers, processes, assignments, setAssignments, date, setDate, line, setLine, showStatus, loadAssignments }) {
  const [dragWorker, setDragWorker] = useState(null);
  const [filterType, setFilterType] = useState('all');

  const lineProcesses = processes.filter(p => p.line === line).sort((a,b) => a.process_no.localeCompare(b.process_no));
  const assignedWorkerIds = new Set(assignments.map(a => a.worker_id));

  const unassigned = workers.filter(w => {
    if (!assignedWorkerIds.has(w.id) === false) return false;
    if (filterType === 'regular') return w.worker_type === '正規';
    if (filterType === 'support') return w.worker_type !== '正規';
    return true;
  }).filter(w => !assignedWorkerIds.has(w.id));

  const getProcessWorkers = (pid) =>
    assignments.filter(a => a.process_id === pid).map(a => workers.find(w => w.id === a.worker_id)).filter(Boolean);

  const assignWorker = async (processId) => {
    if (!dragWorker) return;
    const already = assignments.find(a => a.process_id === processId && a.worker_id === dragWorker.id);
    if (already) return;
    const { data } = await db.from('daily_assignments').insert({
      date, line, process_id: processId, worker_id: dragWorker.id
    }).select().single();
    if (data) { setAssignments(prev => [...prev, data]); showStatus('✅ アサインしました'); }
    setDragWorker(null);
  };

  const removeAssignment = async (processId, workerId) => {
    await db.from('daily_assignments').delete().eq('date', date).eq('line', line).eq('process_id', processId).eq('worker_id', workerId);
    setAssignments(prev => prev.filter(a => !(a.process_id === processId && a.worker_id === workerId)));
    showStatus('🔄 解除しました');
  };

  const copyYesterday = async () => {
    const prev = new Date(date); prev.setDate(prev.getDate()-1);
    const prevDate = prev.toISOString().split('T')[0];
    const { data: prevA } = await db.from('daily_assignments').select('*').eq('date', prevDate).eq('line', line);
    if (!prevA || prevA.length === 0) { showStatus('前日データなし', 'err'); return; }
    const toInsert = prevA.map(a => ({ date, line, process_id: a.process_id, worker_id: a.worker_id }));
    const { data } = await db.from('daily_assignments').insert(toInsert).select();
    if (data) { setAssignments(prev => [...prev, ...data]); showStatus(`✅ 前日から${data.length}件コピーしました`); }
  };

  const clearAll = async () => {
    if (!confirm(`${date} ${line}ラインの配置を全クリアしますか？`)) return;
    await db.from('daily_assignments').delete().eq('date', date).eq('line', line);
    setAssignments([]);
    showStatus('🗑️ クリアしました');
  };

  const totalRequired = lineProcesses.reduce((s, p) => s + (p.required_count||1), 0);
  const totalAssigned = assignments.length;

  return (
    <div style={{ display:'flex', height:'100%', overflow:'hidden' }}>
      {/* 左：未配置作業員 */}
      <div style={{ width:220, background:'#151823', borderRight:'1px solid #1e2235', display:'flex', flexDirection:'column', flexShrink:0 }}>
        <div style={{ padding:'12px 12px 8px', borderBottom:'1px solid #1e2235' }}>
          <div style={{ fontSize:12, fontWeight:700, color:'#94a3b8', marginBottom:8 }}>未配置 ({unassigned.length}名)</div>
          <div style={{ display:'flex', gap:4 }}>
            {[['all','全員'],['regular','正規'],['support','応援']].map(([v,l]) => (
              <button key={v} onClick={() => setFilterType(v)} style={{
                flex:1, padding:'4px 0', borderRadius:4, border:'none', cursor:'pointer', fontSize:10, fontWeight:600,
                background: filterType===v ? '#3b82f6' : '#1e2235', color: filterType===v ? '#fff' : '#64748b',
              }}>{l}</button>
            ))}
          </div>
        </div>
        <div style={{ flex:1, overflowY:'auto', padding:8 }}>
          {unassigned.map(w => (
            <div key={w.id} draggable onDragStart={() => setDragWorker(w)}
              style={{ display:'flex', alignItems:'center', gap:8, padding:'8px 10px', marginBottom:4, borderRadius:6,
                background:'#1a1d2a', border:`1px solid ${w.worker_type==='正規' ? '#1d4ed833' : '#d9770633'}`,
                cursor:'grab', userSelect:'none', transition:'all 0.1s' }}
              onMouseEnter={e => e.currentTarget.style.borderColor = w.color}
              onMouseLeave={e => e.currentTarget.style.borderColor = w.worker_type==='正規' ? '#1d4ed833' : '#d9770633'}
            >
              <div style={{ width:28, height:28, borderRadius:'50%', background:w.color, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, color:'#fff', flexShrink:0 }}>{w.avatar}</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:11, fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{w.name}</div>
                <span className={`tag ${w.worker_type==='正規' ? 'tag-regular' : 'tag-support'}`}>{w.worker_type}</span>
              </div>
            </div>
          ))}
          {unassigned.length === 0 && <div style={{ fontSize:11, color:'#22c55e', textAlign:'center', marginTop:20 }}>✅ 全員配置済み</div>}
        </div>
      </div>

      {/* 右：配置エリア */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
        {/* コントロールバー */}
        <div style={{ padding:'10px 16px', background:'#151823', borderBottom:'1px solid #1e2235', display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}>
          <input type="date" value={date} onChange={e => setDate(e.target.value)} style={{ width:140 }} />
          <div style={{ display:'flex', gap:2, background:'#1e2235', borderRadius:6, padding:2 }}>
            {['A','B'].map(l => (
              <button key={l} onClick={() => setLine(l)} style={{
                padding:'5px 16px', borderRadius:4, border:'none', cursor:'pointer', fontWeight:700, fontSize:12,
                background: line===l ? (l==='A' ? '#3b82f6' : '#a855f7') : 'none',
                color: line===l ? '#fff' : '#64748b',
              }}>{l}ライン</button>
            ))}
          </div>
          <button className="btn btn-ghost" onClick={copyYesterday}>📋 前日コピー</button>
          <button className="btn btn-danger" onClick={clearAll}>🗑️ 全クリア</button>
          <div style={{ marginLeft:'auto', fontSize:12, color:'#64748b' }}>
            配置: <span style={{ color: totalAssigned >= totalRequired ? '#4ade80' : '#fb923c', fontWeight:700 }}>{totalAssigned}</span> / {totalRequired}名
          </div>
        </div>

        {/* 工程グリッド */}
        <div style={{ flex:1, overflowY:'auto', padding:16 }}
          onDragOver={e => e.preventDefault()}
        >
          {lineProcesses.length === 0 && (
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'50%', color:'#334155' }}>
              <div style={{ fontSize:48 }}>⚙️</div>
              <div style={{ fontSize:14, marginTop:12 }}>「工程管理」タブで工程を登録してください</div>
            </div>
          )}
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(200px,1fr))', gap:10 }}>
            {lineProcesses.map(p => {
              const pWorkers = getProcessWorkers(p.id);
              const needed = p.required_count || 1;
              const ok = pWorkers.length >= needed;
              const lineColor = line === 'A' ? '#3b82f6' : '#a855f7';
              return (
                <div key={p.id}
                  onDragOver={e => e.preventDefault()}
                  onDrop={() => assignWorker(p.id)}
                  style={{ background:'#151823', border:`1px solid ${ok ? '#16a34a55' : '#1e2235'}`, borderRadius:10, padding:12,
                    boxShadow: ok ? '0 0 0 1px #16a34a33' : 'none', transition:'all 0.15s' }}
                  onDragEnter={e => e.currentTarget.style.borderColor = lineColor}
                  onDragLeave={e => e.currentTarget.style.borderColor = ok ? '#16a34a55' : '#1e2235'}
                >
                  <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:8 }}>
                    <div style={{ width:30, height:30, borderRadius:6, background:`${lineColor}22`, border:`1px solid ${lineColor}55`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, fontWeight:700, color:lineColor, flexShrink:0 }}>{p.process_no}</div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:12, fontWeight:700, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{p.process_name}</div>
                      <div style={{ fontSize:10, color: ok ? '#4ade80' : '#fb923c' }}>{pWorkers.length}/{needed}名</div>
                    </div>
                  </div>
                  <div style={{ display:'flex', flexWrap:'wrap', gap:4, minHeight:28 }}>
                    {pWorkers.map(w => (
                      <div key={w.id} title={`${w.name}（クリックで解除）`} onClick={() => removeAssignment(p.id, w.id)}
                        style={{ display:'flex', alignItems:'center', gap:4, padding:'3px 7px', borderRadius:12,
                          background:`${w.color}22`, border:`1px solid ${w.color}66`, cursor:'pointer', fontSize:10, color:'#e2e8f0' }}
                      >
                        <div style={{ width:14, height:14, borderRadius:'50%', background:w.color, display:'flex', alignItems:'center', justifyContent:'center', fontSize:8, fontWeight:700, color:'#fff' }}>{w.avatar}</div>
                        {w.name.split(' ')[0]}
                        {w.worker_type !== '正規' && <span style={{ color:'#fb923c', fontSize:9 }}>応</span>}
                      </div>
                    ))}
                    {pWorkers.length < needed && (
                      <div style={{ fontSize:10, color:'#334155', border:'1px dashed #1e2235', borderRadius:6, padding:'4px 8px' }}>
                        ここへドロップ
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
